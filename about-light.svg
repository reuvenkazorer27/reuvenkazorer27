  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .fact { opacity: 0; animation: fact 12.899999999999999s linear infinite backwards; }
  @keyframes fact { 0% { opacity: 0; } 3.1%, 30.23% { opacity: 1; } 33.33%, 100% { opacity: 0; } }
</style>
